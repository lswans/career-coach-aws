    const isSelEdge = selEdges && (g.dataset.edges || '').split(' ').includes(selEdges) || (selEdges && g.dataset.sel === 'edge:' + selEdges);
    g.classList.toggle('hl', !!touches);
    g.classList.toggle('sel', !!isSelEdge && g.classList.contains('edge'));
    g.classList.toggle('dim', matches ? !(matches.has(g.dataset.a) || matches.has(g.dataset.b)) : !!((focus && !touches) || (selEdges && !isSelEdge)));
  });
  svg.querySelectorAll('.grp').forEach(g => g.classList.toggle('sel', !!sel && sel.type === 'group' && sel.id === g.dataset.gid));
}
function select(type, id) {
  S.selected = type ? { type, id } : null;
  highlight();
  renderPanel();
}

// ---------------------------------------------------------------- view transform
function applyView() { if (vp) vp.setAttribute('transform', `translate(${S.view.x},${S.view.y}) scale(${S.view.k})`); }
function fitView() {
  const r = svg.getBoundingClientRect(), bb = LAYOUT.bbox, m = 36;
  const k = Math.min((r.width - 2 * m) / Math.max(bb.w, 1), (r.height - 2 * m) / Math.max(bb.h, 1), 1.4);
  S.view = { k, x: (r.width - bb.w * k) / 2 - bb.x * k, y: (r.height - bb.h * k) / 2 - bb.y * k };
  applyView();
}
function centerOn(id) {
  const it = LAYOUT.rep(id);
  if (!it) return;
  const r = svg.getBoundingClientRect(), k = Math.max(S.view.k, 0.9);
  S.view = { k, x: r.width / 2 - (it.x + it.w / 2) * k, y: r.height / 2 - (it.y + it.h / 2) * k };
  applyView();
}

svg.addEventListener('wheel', e => {
  e.preventDefault();
  const r = svg.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  const k = Math.max(0.08, Math.min(4, S.view.k * Math.exp(-e.deltaY * 0.0015)));
  S.view.x = mx - (mx - S.view.x) * (k / S.view.k);
  S.view.y = my - (my - S.view.y) * (k / S.view.k);
  S.view.k = k;
  applyView();
}, { passive: false });

let drag = null, lastClick = { key: null, t: 0 }, raf = 0;
svg.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  const t = e.target.closest('[data-drag]');
  const id = t ? t.dataset.drag : null;
  const o = id ? (S.offsets[id] || { dx: 0, dy: 0 }) : null;
  drag = { id, target: e.target, sx: e.clientX, sy: e.clientY, moved: false, base: id ? { dx: o.dx || 0, dy: o.dy || 0 } : { x: S.view.x, y: S.view.y } };
  try { svg.setPointerCapture(e.pointerId); } catch (_) { /* synthetic or already-released pointer */ }
});
svg.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  if (!drag.moved && Math.hypot(dx, dy) < 4) return;
  drag.moved = true;
  if (drag.id) {
    S.offsets[drag.id] = { dx: drag.base.dx + dx / S.view.k, dy: drag.base.dy + dy / S.view.k };
    if (!raf) raf = requestAnimationFrame(() => { raf = 0; render(); });
  } else {
    svg.classList.add('panning');
    S.view.x = drag.base.x + dx; S.view.y = drag.base.y + dy;
    applyView();
  }
});
svg.addEventListener('pointerup', () => {
  if (!drag) return;
  svg.classList.remove('panning');
  const d = drag; drag = null;
  if (d.moved) return;
  const t = d.target && d.target.closest ? d.target.closest('[data-sel]') : null;
  const key = t ? t.dataset.sel : null;
  const now = Date.now();
  const dbl = key && key === lastClick.key && now - lastClick.t < 380;
  lastClick = { key, t: now };
  if (dbl && key.startsWith('group:')) {
    const gid = key.slice(6);
    if (S.collapsed.has(gid)) S.collapsed.delete(gid); else S.collapsed.add(gid);
    render();
    return;
  }
  if (!key) { select(null); return; }
  const i = key.indexOf(':');
  select(key.slice(0, i), key.slice(i + 1));
});

// ---------------------------------------------------------------- panel
function kv(rows) {
  const r = rows.filter(([, v]) => v !== undefined && v !== null && v !== '');
  if (!r.length) return '';
  return '<table>' + r.map(([k, v, raw]) => `<tr><td>${esc(k)}</td><td>${raw ? v : fmt(v)}</td></tr>`).join('') + '</table>';
}
function fmt(v) {
  if (v === null || v === undefined) return '';
  if (typeof v === 'object') { const s = JSON.stringify(v); return '<code>' + esc(s.length > 400 ? s.slice(0, 400) + '…' : s) + '</code>'; }
  const s = String(v);
  if (/^arn:aws[a-z-]*:/.test(s)) return '<code>' + esc(s) + '</code>';
  return esc(s);
}
function chipFor(n) { return `<span class="chip" style="background:${nodeColor(n)}">${esc(glyphOf(n))}</span>`; }
function crumbs(groupId) {
  const parts = [];
  for (let g = GROUP_BY_ID.get(groupId), guard = 0; g && guard < 50; g = GROUP_BY_ID.get(g.parent), guard++) parts.unshift(`<a data-goto="group:${esc(g.id)}">${esc(g.label || g.id)}</a>`);
  return parts.length ? `<div class="crumbs">${parts.join(' › ')}</div>` : '';
}
function consoleLink(arn) {
  if (!arn || !/^arn:aws[a-z-]*:/.test(arn)) return '';
  const host = arn.startsWith('arn:aws-cn:') ? 'console.amazonaws.cn' : arn.startsWith('arn:aws-us-gov:') ? 'console.amazonaws-us-gov.com' : 'console.aws.amazon.com';
  return `<a href="https://${host}/go/view?arn=${encodeURIComponent(arn)}" target="_blank" rel="noopener">Open in AWS console ↗</a>`;
}
function connections(id) {
  const outE = MODEL.edges.filter(e => e.from === id), inE = MODEL.edges.filter(e => e.to === id);
  const li = (e, peer, arrow) => `<li>${arrow} <a data-goto="${NODE_BY_ID.has(peer) ? 'node' : 'group'}:${esc(peer)}">${esc(labelOf(peer))}</a> <span class="muted">${esc(e.label || '')} · <a data-goto="edge:${esc(e.id)}">${esc(edgeStyle(e.kind).name.toLowerCase())}</a>${S.hiddenKinds.has(e.kind) ? ' (hidden)' : ''}</span></li>`;
  let h = '';
  if (outE.length) h += '<h3>Outgoing</h3><ul>' + outE.map(e => li(e, e.to, '→')).join('') + '</ul>';
  if (inE.length) h += '<h3>Incoming</h3><ul>' + inE.map(e => li(e, e.from, '←')).join('') + '</ul>';
  return h;
}
function sourceText(src) {
  if (!src) return '';
  if (typeof src === 'string') return src;
  return [src.file, src.line ? ':' + src.line : '', src.construct ? ` (${src.construct})` : ''].join('');
}
function renderPanel() {
  const p = $('#panel'), sel = S.selected;
  if (!sel) { p.innerHTML = overviewHtml(); bindPanel(); return; }
  if (sel.type === 'node') {
    const n = NODE_BY_ID.get(sel.id);
    if (!n) { select(null); return; }
    const s = svc(n);
    p.innerHTML = crumbs(n.group) +
      `<h2>${chipFor(n)}${esc(n.label || n.id)}</h2><div class="muted">${esc(n.kind || '')}${n.kind && s ? ' · ' : ''}${esc(s ? s.name : (n.service || ''))}</div>` +
      (n.status && STATUS[n.status] ? `<p><span class="pill" style="background:${STATUS[n.status].color}">${esc(STATUS[n.status].name)}</span></p>` : '') +
      (n.description ? `<p>${esc(n.description)}</p>` : '') +
      (n.notes ? `<div class="notes">${esc(n.notes)}</div>` : '') +
      '<h3>Resource</h3>' + kv([['ID', n.id], ['ARN', n.arn], ['Physical ID', n.physicalId], ['Source', sourceText(n.source)], ['Origin', n.origin], ['', consoleLink(n.arn), true]]) +
      (n.details && Object.keys(n.details).length ? '<h3>Details</h3>' + kv(Object.entries(n.details)) : '') +
      (n.tags && Object.keys(n.tags).length ? '<h3>Tags</h3>' + kv(Object.entries(n.tags)) : '') +
      connections(n.id);
  } else if (sel.type === 'group') {
    const g = GROUP_BY_ID.get(sel.id);
    if (!g) { select(null); return; }
    const members = MODEL.nodes.filter(n => n.group === g.id), subs = MODEL.groups.filter(x => x.parent === g.id);
    p.innerHTML = crumbs(g.parent) + `<h2>${esc(g.label || g.id)}</h2><div class="muted">${esc(groupStyle(g).name)}</div>` +
      (g.description ? `<p>${esc(g.description)}</p>` : '') + (g.notes ? `<div class="notes">${esc(g.notes)}</div>` : '') +
      `<p><button class="inline" data-toggle="${esc(g.id)}" style="background:#f2f3f3;color:#16191f;border-color:#d5dbe1">${S.collapsed.has(g.id) ? 'Expand group' : 'Collapse group'}</button></p>` +
      kv([['ID', g.id], ['ARN', g.arn], ['', consoleLink(g.arn), true]]) +
      (g.details && Object.keys(g.details).length ? '<h3>Details</h3>' + kv(Object.entries(g.details)) : '') +
      (subs.length ? '<h3>Sub-groups</h3><ul>' + subs.map(x => `<li><a data-goto="group:${esc(x.id)}">${esc(x.label || x.id)}</a> <span class="muted">${esc(groupStyle(x).name)}</span></li>`).join('') + '</ul>' : '') +
      (members.length ? '<h3>Resources</h3><ul>' + members.map(x => `<li><a data-goto="node:${esc(x.id)}">${esc(x.label || x.id)}</a> <span class="muted">${esc(x.kind || (svc(x) || {}).name || x.service || '')}</span></li>`).join('') + '</ul>' : '') +
      connections(g.id);
  } else if (sel.type === 'edge') {
    const e = EDGE_BY_ID.get(sel.id);
    if (!e) { select(null); return; }
    const ae = LAYOUT.AGG.find(a => a.edges.includes(e));
    const list = ae ? ae.edges : [e];
    p.innerHTML = '<h2>Connection</h2>' + list.map(x => `<h3>${esc(labelOf(x.from))} → ${esc(labelOf(x.to))}</h3>` +
      kv([['Kind', edgeStyle(x.kind).name], ['Label', x.label], ['Description', x.description], ['Status', x.status && STATUS[x.status] ? STATUS[x.status].name : x.status], ['Source', sourceText(x.source)], ['Origin', x.origin], ['ID', x.id]]) +
      (x.details && Object.keys(x.details).length ? kv(Object.entries(x.details)) : '') +
      `<p><a data-goto="${NODE_BY_ID.has(x.from) ? 'node' : 'group'}:${esc(x.from)}">← ${esc(labelOf(x.from))}</a> &nbsp; <a data-goto="${NODE_BY_ID.has(x.to) ? 'node' : 'group'}:${esc(x.to)}">${esc(labelOf(x.to))} →</a></p>`).join('');
  }
  bindPanel();
}
function overviewHtml() {
  const m = MODEL.meta;
  const cats = {};
  MODEL.nodes.forEach(n => { const c = catOf(n); cats[c] = (cats[c] || 0) + 1; });
  const kinds = {};
  MODEL.edges.forEach(e => { kinds[e.kind] = (kinds[e.kind] || 0) + 1; });
  const statuses = {};
  MODEL.nodes.forEach(n => { if (n.status) statuses[n.status] = (statuses[n.status] || 0) + 1; });
  const gtypes = {};
  MODEL.groups.forEach(g => { gtypes[g.type || 'generic'] = (gtypes[g.type || 'generic'] || 0) + 1; });
  let h = `<h2>${esc(m.title || 'AWS architecture')}</h2>`;
  if (m.description) h += `<p>${esc(m.description)}</p>`;
  h += `<p class="muted">${MODEL.nodes.length} resources · ${MODEL.edges.length} connections · ${MODEL.groups.length} groups</p>`;
  if (m.notes) h += `<div class="notes">${esc(m.notes)}</div>`;
  h += '<h3>Services</h3>' + Object.entries(cats).sort((a, b) => b[1] - a[1]).map(([c, k]) => {
    const cc = CATALOG.categories[c] || CATALOG.categories.general;
    return `<div class="legend-row"><span class="chip" style="background:${cc.color}">&nbsp;</span>${esc(cc.name)}<span class="count">${k}</span></div>`;
  }).join('');
  if (Object.keys(kinds).length) h += '<h3>Connections</h3>' + Object.entries(kinds).map(([k, c]) => {
    const st = edgeStyle(k), name = EDGE_KINDS[k] ? st.name : k;
    return `<div class="legend-row"><svg width="38" height="10"><line x1="1" y1="5" x2="37" y2="5" stroke="${st.color}" stroke-width="2" stroke-dasharray="${st.dash}"/></svg>${esc(name)}${S.hiddenKinds.has(k) ? ' <span class="muted">(hidden — View menu)</span>' : ''}<span class="count">${c}</span></div>`;
  }).join('');
  if (Object.keys(statuses).length) h += '<h3>Code vs. account</h3>' + Object.entries(statuses).map(([s, c]) => {
    const st = STATUS[s] || { name: s, color: '#5f6b7a', sym: '?' };
    return `<div class="legend-row"><span class="chip" style="background:${st.color};border-radius:11px">${st.sym}</span>${esc(st.name)}<span class="count">${c}</span></div>`;
  }).join('') + '<div class="muted" style="font-size:12px;margin-top:4px">Resources in code and deployed show no badge.</div>';
  if (Object.keys(gtypes).length) h += '<h3>Groups</h3>' + Object.entries(gtypes).map(([t, c]) => {
    const st = GROUP_STYLES[t] || GROUP_STYLES.generic;
    return `<div class="legend-row"><span class="chip" style="background:${st.stroke};border-radius:2px">${esc(st.tag)}</span>${esc(st.name)}<span class="count">${c}</span></div>`;
  }).join('');
  const srcs = m.sources || [];
  if (srcs.length) h += '<h3>Sources</h3><ul>' + srcs.map(s => `<li>${esc(s.type || 'source')}: ${esc(s.path || s.description || [s.accountId, (s.regions || []).join(', '), s.profile ? '(' + s.profile + ')' : ''].filter(Boolean).join(' '))}${s.scannedAt ? ` <span class="muted">· ${esc(s.scannedAt)}</span>` : ''}</li>`).join('') + '</ul>';
  h += '<h3>Generated</h3>' + kv([['Created', m.generatedAt], ['Last updated', m.updatedAt], ['Project', m.project], ['Generator', m.generator || 'aws-architecture-diagram skill']]);
  const log = (m.changelog || []).slice().reverse().slice(0, 15);
  if (log.length) h += '<h3>Change log</h3><ul>' + log.map(c => `<li><b>${esc(c.date || '')}</b> ${esc(c.summary || '')}</li>`).join('') + '</ul>';
  h += '<p class="muted" style="font-size:12px;margin-top:18px">Click a resource, connection, or group header for details.</p>';
  return h;
}
function bindPanel() {
  const p = $('#panel');
  p.querySelectorAll('[data-goto]').forEach(a => a.addEventListener('click', ev => {
    ev.preventDefault();
    const v = a.dataset.goto, i = v.indexOf(':'), type = v.slice(0, i), id = v.slice(i + 1);
    select(type, id);
    if (type !== 'edge') centerOn(id);
  }));
  p.querySelectorAll('[data-toggle]').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.toggle;
    if (S.collapsed.has(id)) S.collapsed.delete(id); else S.collapsed.add(id);
    render(); renderPanel();
  }));
}

// ---------------------------------------------------------------- view menu
function renderViewMenu() {
  const kindsPresent = [...new Set(MODEL.edges.map(e => e.kind))];
  const pop = $('#view-pop');
  pop.innerHTML = '<h4>Layout direction</h4>' +
    `<label><input type="radio" name="dir" value="LR" ${S.dir === 'LR' ? 'checked' : ''}> Left → right</label>` +
    `<label><input type="radio" name="dir" value="TB" ${S.dir === 'TB' ? 'checked' : ''}> Top → bottom</label>` +
    (kindsPresent.length ? '<h4>Connections</h4>' + kindsPresent.map(k => `<label><input type="checkbox" data-kind="${esc(k)}" ${S.hiddenKinds.has(k) ? '' : 'checked'}> ${esc(edgeStyle(k).name)}</label>`).join('') : '') +
    '<h4>Display</h4>' +
    `<label><input type="checkbox" id="opt-labels" ${S.showLabels ? 'checked' : ''}> Connection labels</label>` +
    `<label><input type="checkbox" id="opt-status" ${S.showStatus ? 'checked' : ''}> Code vs. account badges</label>` +
    '<h4>Groups &amp; layout</h4><button id="btn-expand">Expand all groups</button><button id="btn-collapse-sub">Collapse all subnets</button><button id="btn-reset">Reset manual positions</button>';
  pop.querySelectorAll('input[name=dir]').forEach(r => r.addEventListener('change', () => { S.dir = r.value; S.offsets = {}; render(); fitView(); }));
  pop.querySelectorAll('input[data-kind]').forEach(c => c.addEventListener('change', () => { if (c.checked) S.hiddenKinds.delete(c.dataset.kind); else S.hiddenKinds.add(c.dataset.kind); render(); if (!S.selected) renderPanel(); }));
  $('#opt-labels').addEventListener('change', ev => { S.showLabels = ev.target.checked; render(); });
  $('#opt-status').addEventListener('change', ev => { S.showStatus = ev.target.checked; render(); });
  $('#btn-expand').addEventListener('click', () => { S.collapsed.clear(); render(); fitView(); });
  $('#btn-collapse-sub').addEventListener('click', () => { MODEL.groups.filter(g => /^subnet/.test(g.type || '')).forEach(g => S.collapsed.add(g.id)); render(); fitView(); });
  $('#btn-reset').addEventListener('click', () => { S.offsets = {}; render(); fitView(); });
}

// ---------------------------------------------------------------- export
function currentModel() {
  const m = JSON.parse(JSON.stringify(MODEL));
  const offsets = {};
  for (const [id, o] of Object.entries(S.offsets)) if (o && (Math.abs(o.dx) > 0.5 || Math.abs(o.dy) > 0.5)) offsets[id] = { dx: Math.round(o.dx), dy: Math.round(o.dy) };
  m.layout = Object.assign({}, m.layout || {}, { direction: S.dir, offsets, collapsed: [...S.collapsed], hiddenEdgeKinds: [...S.hiddenKinds], showEdgeLabels: S.showLabels });
  return m;
}
function jsonForScript(obj) { return JSON.stringify(obj, null, 1).replace(/</g, '\\u003c'); }
function buildSvg() {
  const bb = LAYOUT.bbox, m = 30, titleH = MODEL.meta.title ? 40 : 0;
  const clone = svg.cloneNode(true);
  clone.setAttribute('xmlns', SVGNS);
  const w = Math.ceil(bb.w + 2 * m), h = Math.ceil(bb.h + 2 * m + titleH);
  clone.setAttribute('viewBox', `${bb.x - m} ${bb.y - m - titleH} ${w} ${h}`);
  clone.setAttribute('width', w); clone.setAttribute('height', h);
  clone.removeAttribute('id'); clone.removeAttribute('class');
  const v = clone.querySelector('#viewport');
  v.removeAttribute('transform');
  clone.querySelectorAll('.dim, .sel, .hl').forEach(n => n.classList.remove('dim', 'sel', 'hl'));
  clone.querySelectorAll('title').forEach(t => t.remove());
  const bg = document.createElementNS(SVGNS, 'rect');
  bg.setAttribute('x', bb.x - m); bg.setAttribute('y', bb.y - m - titleH); bg.setAttribute('width', w); bg.setAttribute('height', h); bg.setAttribute('fill', '#ffffff');
  clone.insertBefore(bg, clone.firstChild.nextSibling);
  if (titleH) {
    const t = document.createElementNS(SVGNS, 'text');
    t.setAttribute('x', bb.x); t.setAttribute('y', bb.y - m - titleH + 30); t.setAttribute('font-size', 18); t.setAttribute('font-weight', 700); t.setAttribute('fill', '#232F3E'); t.setAttribute('font-family', FONT);
    t.textContent = MODEL.meta.title;
    clone.appendChild(t);
  }
  return { text: '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(clone), w, h };
}
$('#btn-svg').addEventListener('click', () => { download(buildSvg().text, slug() + '.svg', 'image/svg+xml'); });
$('#btn-png').addEventListener('click', () => {
  const { text, w, h } = buildSvg();
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas'), s = 2;
    c.width = w * s; c.height = h * s;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(img, 0, 0, c.width, c.height);
    try { c.toBlob(b => download(b, slug() + '.png')); } catch (err) { alert('PNG export failed (external icon images taint the canvas). Use SVG export instead.'); }
  };
  img.onerror = () => alert('PNG export failed. Use SVG export instead.');
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(text);
});
$('#btn-json').addEventListener('click', () => { download(JSON.stringify(currentModel(), null, 2), slug() + '.diagram.json', 'application/json'); });
function pageHtml() {
  const doc = PRISTINE.cloneNode(true);
  doc.querySelector('#aws-diagram-model').textContent = jsonForScript(currentModel());
  return '<!DOCTYPE html>\n' + doc.outerHTML;
}
$('#btn-html').addEventListener('click', () => { download(pageHtml(), slug() + '.html', 'text/html'); });

// ---------------------------------------------------------------- chrome
$('#title').textContent = MODEL.meta.title || 'AWS Architecture Diagram';
document.title = (MODEL.meta.title || 'AWS Architecture') + ' — architecture diagram';
$('#subtitle').textContent = [MODEL.meta.project, MODEL.meta.updatedAt ? 'updated ' + MODEL.meta.updatedAt : (MODEL.meta.generatedAt ? 'generated ' + MODEL.meta.generatedAt : '')].filter(Boolean).join(' · ');
$('#btn-fit').addEventListener('click', fitView);
$('#btn-panel').addEventListener('click', () => { document.body.classList.toggle('panel-hidden'); setTimeout(fitView, 0); });
const search = $('#search');
search.addEventListener('input', () => { S.search = search.value; highlight(); });
search.addEventListener('keydown', ev => {
  if (ev.key === 'Enter') {
    const q = S.search.trim().toLowerCase();
    const n = q && MODEL.nodes.find(x => nodeMatches(x, q));
    if (n) { select('node', n.id); centerOn(n.id); }
  } else if (ev.key === 'Escape') { search.value = ''; S.search = ''; highlight(); search.blur(); }
});
document.addEventListener('keydown', ev => {
  if (ev.target.tagName === 'INPUT') return;
  if (ev.key === '/') { ev.preventDefault(); search.focus(); }
  else if (ev.key === 'f' || ev.key === 'F') fitView();
  else if (ev.key === 'Escape') select(null);
});
document.addEventListener('click', ev => { document.querySelectorAll('details.menu[open]').forEach(d => { if (!d.contains(ev.target)) d.removeAttribute('open'); }); });
window.addEventListener('resize', () => { if (LAYOUT) applyView(); });

renderViewMenu();
render();
renderPanel();
fitView();
window.__awsDiagram = { model: MODEL, state: S, render, fitView, select, currentModel, buildSvg, pageHtml, layout: () => LAYOUT };
})();
